<!DOCTYPE html>
<body>
<script type="text/javascript">
var audio = new Audio();
audio.oncanplay = function() {
  audio.oncanplay = null;
  audio.play();
};
audio.src = "audio.ogg";
audio.loop = true;
audio.id = "v";
document.body.appendChild(audio);
</script>
</body>
